<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleepingbox - Stock System</title>
    <!-- ดึงฟอนต์ Mitr มาใช้งาน -->
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #f472b6; /* ชมพูน่ารักละมุน */
            --primary-hover: #ec4899;
            --bg-color: #fff1f2; /* พื้นหลังสีชมพูอ่อนพาสเทล */
            --card-bg: #ffffff; /* การ์ดสีขาวสะอาดตา */
            --text-color: #57534e;
            --border-color: #fbcfe8; /* ขอบสีชมพูอ่อน */
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mitr', sans-serif !important; font-weight: 300 !important; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 750px; background: var(--card-bg); padding: 24px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(244, 114, 182, 0.15); border: 2px solid #ffffff; }

        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 1.6rem; color: #db2777; margin: 0; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; background: #fff1f2; padding: 6px; border-radius: 14px; border: 1px solid #fce7f3; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; cursor: pointer; border-radius: 10px; transition: all 0.2s; color: #db2777; }
        .tab-btn.active { background: #ffffff; color: #be185d; box-shadow: 0 4px 12px rgba(244, 114, 182, 0.15); }

        .search-filter-box { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
        .search-input { flex: 2; min-width: 150px; padding: 12px 14px; border: 2px solid var(--border-color); border-radius: 12px; font-size: 0.95rem; outline: none; background: #ffffff; transition: border-color 0.2s; }
        .search-input:focus { border-color: var(--primary-color); }
        .filter-select { flex: 1; padding: 12px; border: 2px solid var(--border-color); border-radius: 12px; font-size: 0.95rem; outline: none; background: #ffffff; cursor: pointer; }
        .filter-select:focus { border-color: var(--primary-color); }

        .search-top-row { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
        .search-btn { background-color: var(--primary-color); color: white; border: none; padding: 12px 20px; border-radius: 12px; font-size: 0.95rem; cursor: pointer; transition: background 0.2s, transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 10px rgba(244, 114, 182, 0.25); white-space: nowrap; }
        .search-btn:hover { background-color: var(--primary-hover); }

        .toggle-advanced-btn { width: 100%; background: #fff1f2; color: #db2777; border: 2px dashed #fda4af; padding: 10px; border-radius: 12px; font-size: 0.9rem; cursor: pointer; margin-bottom: 12px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 400; }
        .toggle-advanced-btn:hover { background: #ffe4e6; border-color: #f43f5e; }

        .advanced-filter-panel { display: none; background: #fff1f2; border: 2px solid #fda4af; padding: 12px; border-radius: 12px; margin-bottom: 16px; animation: fadeIn 0.3s ease; }
        .advanced-filter-panel.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-filter-group { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .alert-filter-group label { font-size: 0.85rem; color: #e11d48; margin: 0; white-space: nowrap; }
        
        .operator-group { display: flex; gap: 4px; background: #ffe4e6; padding: 3px; border-radius: 8px; }
        .op-btn { background: transparent; border: none; padding: 6px 14px; border-radius: 6px; font-size: 0.95rem; font-weight: bold; color: #e11d48; cursor: pointer; transition: 0.2s; }
        .op-btn.active { background: #e11d48; color: white; box-shadow: 0 2px 5px rgba(225, 29, 72, 0.3); }

        .alert-input { width: 80px; padding: 6px; border: 2px solid #fda4af; border-radius: 8px; text-align: center; font-size: 0.95rem; background: #ffffff; color: #e11d48; font-weight: bold; outline: none; }
        .alert-filter-btn { background-color: #e11d48; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; transition: background 0.2s; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
        .alert-filter-btn:hover { background-color: #be123c; }

        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: #db2777; }
        select, input { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 12px; font-size: 1rem; outline: none; background: #ffffff; }
        select:focus, input:focus { border-color: var(--primary-color); }

        .color-palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 8px; }
        .color-btn { padding: 10px; border: 2px solid var(--border-color); border-radius: 10px; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; text-align: center; background-color: #ffffff; }
        .color-btn:hover { opacity: 0.85; transform: scale(1.02); }
        .color-btn.active { border-color: #be185d; box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.3); transform: scale(1.05); }

        .sku-preview { background: #fff1f2; border: 2px dashed var(--primary-color); color: #db2777; text-align: center; letter-spacing: 2px; font-weight: bold; }

        .action-btn { width: 100%; padding: 14px; background: var(--primary-color); color: white; border: none; border-radius: 12px; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: background 0.2s; box-shadow: 0 4px 12px rgba(244, 114, 182, 0.3); }
        .action-btn:hover { background: var(--primary-hover); }

        .delete-action-btn { width: 100%; padding: 12px; background: #fff1f2; color: #ef4444; border: 2px solid #fecdd3; border-radius: 12px; font-size: 0.95rem; cursor: pointer; margin-top: 8px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .delete-action-btn:hover { background: #fee2e2; border-color: #f87171; }

        .mode-section { display: none; }
        .mode-section.active { display: block; }

        .fabric-categories { display: flex; gap: 10px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 5px; }
        .fabric-chip { padding: 8px 18px; background: #fff1f2; border: 1px solid #fce7f3; border-radius: 20px; cursor: pointer; white-space: nowrap; transition: 0.2s; color: #db2777; }
        .fabric-chip.active { background: var(--primary-color); color: white; box-shadow: 0 4px 10px rgba(244, 114, 182, 0.3); border-color: var(--primary-color); }

        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .product-card { background: #ffffff; border: 2px solid #fce7f3; border-radius: 16px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; position: relative; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px -5px rgba(244, 114, 182, 0.2); border-color: var(--primary-color); }

        .product-img-container { width: 100%; height: 130px; background: #fff1f2; display: flex; align-items: center; justify-content: center; overflow: hidden; color: #db2777; font-size: 0.85rem; position: relative; }
        .product-img-container img { width: 100%; height: 100%; object-fit: cover; transition: filter 0.3s; }

        .product-card.out-of-stock img { filter: grayscale(100%); opacity: 0.5; }
        .out-of-stock-badge { position: absolute; top: 8px; right: 8px; background: rgba(244, 63, 94, 0.9); color: white; padding: 2px 8px; font-size: 0.7rem; border-radius: 6px; z-index: 2; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .low-stock-badge { position: absolute; top: 8px; left: 8px; background: rgba(234, 179, 8, 0.95); color: white; padding: 2px 8px; font-size: 0.7rem; border-radius: 6px; z-index: 2; box-shadow: 0 2px 6px rgba(0,0,0,0.1); font-weight: bold; }

        .product-info { padding: 10px; }
        .product-name { font-size: 0.95rem; margin-bottom: 2px; color: #831843; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-fabric { font-size: 0.78rem; color: #db2777; line-height: 1.4; }
        .product-update { font-size: 0.72rem; color: #db2777; margin-top: 2px; opacity: 0.85; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; padding: 20px; z-index: 1000; }
        .modal-content { background: white; width: 100%; max-width: 620px; padding: 24px; border-radius: 20px; position: relative; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); border: 2px solid #fce7f3; }
        
        .close-btn { position: absolute; top: 15px; right: 18px; font-size: 1.4rem; cursor: pointer; border: none; background: none; color: #db2777; z-index: 10; }
        .close-btn:hover { color: #be185d; }

        .modal-img-wrapper { display: flex; justify-content: center; margin-bottom: 12px; }
        .modal-img-container { position: relative; display: inline-block; border-radius: 14px; overflow: hidden; background: #fff1f2; max-height: 250px; border: 2px solid #fce7f3; }
        .modal-img-container img { display: block; max-height: 250px; width: auto; object-fit: contain; }
        
        .zoom-btn { position: absolute; bottom: 8px; right: 8px; background: rgba(244, 114, 182, 0.85); color: white; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content
