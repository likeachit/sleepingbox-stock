<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleepingbox - Premium Stock</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #f472b6;
            --primary-hover: #ec4899;
            --bg-color: #fdf2f8;
            --card-bg: #ffffff;
            --text-color: #44403c;
            --border-color: #fce7f3;
            --accent-color: #be185d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mitr', sans-serif !important; font-weight: 300 !important; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px 12px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        
        .container { width: 100%; max-width: 760px; background: var(--card-bg); padding: 32px; border-radius: 28px; box-shadow: 0 20px 40px -15px rgba(244, 114, 182, 0.25); border: 1px solid rgba(255,255,255,0.8); backdrop-filter: blur(10px); }
        
        .header-container { text-align: center; margin-bottom: 28px; }
        h1 { font-size: 2rem; color: var(--accent-color); font-weight: 500 !important; letter-spacing: 0.5px; text-shadow: 0 2px 10px rgba(190, 24, 93, 0.1); }

        .tabs { display: flex; gap: 12px; margin-bottom: 24px; background: #fff1f2; padding: 8px; border-radius: 20px; border: 1px solid var(--border-color); }
        .tab-btn { flex: 1; padding: 14px; border: none; background: transparent; cursor: pointer; border-radius: 14px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); color: var(--accent-color); font-size: 1.05rem; }
        .tab-btn.active { background: #ffffff; color: var(--accent-color); font-weight: 400 !important; box-shadow: 0 8px 20px rgba(244, 114, 182, 0.15); transform: translateY(-2px); }

        .search-top-row { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; }
        .search-input { flex: 2; padding: 14px 18px; border: 2px solid var(--border-color); border-radius: 16px; font-size: 1rem; outline: none; background: #fafaf9; transition: all 0.3s ease; }
        .search-input:focus { border-color: var(--primary-color); background: #fff; box-shadow: 0 0 0 4px rgba(244, 114, 182, 0.15); }
        
        .filter-select { flex: 1; padding: 14px; border: 2px solid var(--border-color); border-radius: 16px; font-size: 0.95rem; outline: none; background: #fafaf9; cursor: pointer; transition: 0.3s; }
        .filter-select:focus { border-color: var(--primary-color); }

        .search-btn { background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); color: white; border: none; padding: 14px 28px; border-radius: 16px; font-size: 1rem; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 20px rgba(190, 24, 93, 0.25); white-space: nowrap; font-weight: 400 !important; }
        .search-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(190, 24, 93, 0.35); }

        .toggle-advanced-btn { width: 100%; background: transparent; color: var(--accent-color); border: 1.5px dashed #fda4af; padding: 12px; border-radius: 16px; font-size: 0.9rem; cursor: pointer; margin-bottom: 20px; transition: 0.2s; }
        .toggle-advanced-btn:hover { background: #fff1f2; border-color: var(--primary-color); }

        .advanced-filter-panel { display: none; background: #fff1f2; border: 1.5px solid #fda4af; padding: 18px; border-radius: 18px; margin-bottom: 24px; animation: slideDown 0.3s ease; }
        .advanced-filter-panel.active { display: block; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .alert-filter-group { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .alert-filter-group label { font-size: 0.95rem; color: #e11d48; margin: 0; font-weight: 400 !important; }
        
        .operator-group { display: flex; gap: 6px; background: #ffe4e6; padding: 6px; border-radius: 14px; }
        .op-btn { background: transparent; border: none; padding: 8px 16px; border-radius: 10px; font-size: 0.9rem; font-weight: 500 !important; color: #e11d48; cursor: pointer; transition: 0.3s; }
        .op-btn.active { background: #e11d48; color: white; box-shadow: 0 4px 10px rgba(225, 29, 72, 0.3); }
        .alert-input { width: 100px; padding: 10px; border: 2px solid #fda4af; border-radius: 12px; text-align: center; font-size: 1rem; background: #fff; color: #e11d48; font-weight: 500 !important; outline: none; }
        
        .fabric-categories { display: flex; gap: 12px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
        .fabric-categories::-webkit-scrollbar { display: none; }
        .fabric-chip { padding: 12px 26px; background: #fff; border: 1.5px solid var(--border-color); border-radius: 24px; cursor: pointer; white-space: nowrap; transition: 0.3s; color: var(--accent-color); font-size: 0.95rem; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .fabric-chip.active { background: var(--accent-color); color: white; box-shadow: 0 6px 15px rgba(190, 24, 93, 0.3); border-color: var(--accent-color); font-weight: 400 !important; transform: scale(1.05); }

        .sort-container { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .sort-btn { background: #fff; border: 1.5px solid var(--border-color); color: var(--accent-color); padding: 8px 16px; border-radius: 14px; font-size: 0.9rem; cursor: pointer; transition: 0.3s; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .sort-btn:hover { background: #fff1f2; border-color: var(--primary-color); }
        .sort-btn.active { background: var(--accent-color); color: white; border-color: var(--accent-color); font-weight: 400 !important; box-shadow: 0 4px 10px rgba(190, 24, 93, 0.2); }

        .print-btn { background: #10b981; color: white; border: none; padding: 8px 18px; border-radius: 14px; font-size: 0.9rem; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); }
        .print-btn:hover { background: #059669; transform: translateY(-1px); }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px; }
        .product-card { background: #ffffff; border: 1.5px solid #fce7f3; border-radius: 20px; overflow: hidden; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; box-shadow: 0 6px 15px rgba(0,0,0,0.04); animation: fadeIn 0.5s ease backwards; }
        .product-card:hover { transform: translateY(-6px); box-shadow: 0 15px 30px -5px rgba(244, 114, 182, 0.3); border-color: var(--primary-color); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .product-img-container { width: 100%; height: 170px; background: #fdf2f8; display: flex; align-items: center; justify-content: center; overflow: hidden; color: #db2777; font-size: 0.9rem; position: relative; }
        .product-img-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .product-card:hover .product-img-container img { transform: scale(1.08); }

        .out-of-stock-badge { position: absolute; top: 12px; right: 12px; background: rgba(244, 63, 94, 0.95); color: white; padding: 4px 12px; font-size: 0.75rem; border-radius: 10px; z-index: 2; box-shadow: 0 4px 10px rgba(244, 63, 94, 0.3); font-weight: 400 !important; backdrop-filter: blur(4px); }
        .low-stock-badge { position: absolute; top: 12px; left: 12px; background: rgba(234, 179, 8, 0.95); color: white; padding: 4px 12px; font-size: 0.75rem; border-radius: 10px; z-index: 2; font-weight: 400 !important; box-shadow: 0 4px 10px rgba(0,0,0,0.1); backdrop-filter: blur(4px); }

        .product-info { padding: 16px; }
        .product-name { font-size: 1.05rem; margin-bottom: 4px; color: #831843; font-weight: 400 !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-fabric { font-size: 0.85rem; color: #db2777; }
        
        .loader-container { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; color: var(--primary-color); }
        .spinner { width: 40px; height: 40px; border: 4px solid #fce7f3; border-top: 4px solid var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .toast { visibility: hidden; min-width: 280px; background-color: var(--accent-color); color: #fff; text-align: center; border-radius: 16px; padding: 16px 20px; position: fixed; z-index: 9999; left: 50%; bottom: 40px; font-size: 1rem; transform: translateX(-50%); box-shadow: 0 10px 30px rgba(190, 24, 93, 0.4); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .toast.show { visibility: visible; animation: fadein 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), fadeout 0.4s 2.5s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards; }
        @keyframes fadein { from {bottom: 0; opacity: 0; transform: translate(-50%, 20px);} to {bottom: 40px; opacity: 1; transform: translate(-50%, 0);} }
        @keyframes fadeout { from {bottom: 40px; opacity: 1; transform: translate(-50%, 0);} to {bottom: 0; opacity: 0; transform: translate(-50%, 20px);} }
        .toast.success { background-color: var(--accent-color); }
        .toast.error { background-color: #e11d48; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); justify-content: center; align-items: center; padding: 12px; z-index: 1000; }
        .modal-content { background: white; width: 100%; max-width: 600px; padding: 24px 16px; border-radius: 28px; position: relative; max-height: 92vh; overflow-y: auto; box-shadow: 0 25px 50px rgba(0,0,0,0.25); animation: scaleUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes scaleUp { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .close-btn { position: absolute; top: 16px; right: 16px; font-size: 1.5rem; cursor: pointer; border: none; background: #fff1f2; color: var(--accent-color); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.3s; z-index: 10; }
        .close-btn:hover { background: #fce7f3; transform: rotate(90deg); }

        .modal-img-container { position: relative; display: inline-block; border-radius: 20px; overflow: hidden; background: #fdf2f8; max-height: 220px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); text-align: center; width: 100%; margin-bottom: 16px;}
        .modal-img-container img { display: inline-block; max-height: 220px; width: auto; object-fit: contain; }

        .stock-table-wrapper { 
            border-radius: 16px; 
            border: 1.5px solid var(--border-color); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
            width: 100%; 
            overflow-x: auto !important; 
            -webkit-overflow-scrolling: touch; 
            margin-bottom: 8px;
        }
        .stock-table { width: 100%; border-collapse: collapse; min-width: 480px; }
        .stock-table th, .stock-table td { border: 1px solid var(--border-color); padding: 10px 6px; text-align: center; font-size: 0.9rem; }
        .stock-table th { background: #fff1f2; color: var(--accent-color); font-weight: 400 !important; white-space: nowrap; }
        .stock-table td:first-child { text-align: left; color: #831843; background: #fffbfc; white-space: nowrap; padding-left: 10px; }
        .stock-input { width: 65px; padding: 6px; border: 2px solid transparent; border-radius: 10px; text-align: center; font-size: 0.95rem; background: transparent; color: #44403c; outline: none; transition: 0.3s; margin: 0 auto; display: block; }
        .stock-input.editable { border-color: var(--primary-color); background: #ffffff; box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.15); }

        .mode-section { display: none; animation: fadeIn 0.4s ease; }
        .mode-section.active { display: block; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 1rem; color: var(--accent-color); }
        select, input[type="text"], input[type="number"], input[type="file"] { width: 100%; padding: 14px 18px; border: 2px solid var(--border-color); border-radius: 16px; font-size: 1rem; outline: none; background: #fafaf9; transition: 0.3s; }
        select:focus, input:focus { border-color: var(--primary-color); background: #fff; box-shadow: 0 0 0 4px rgba(244, 114, 182, 0.15); }

        .color-palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 10px; margin-bottom: 10px; }
        .color-btn { padding: 12px 6px; border: 2px solid var(--border-color); border-radius: 14px; font-size: 0.85rem; cursor: pointer; transition: 0.3s; text-align: center; font-weight: 400 !important; }
        .color-btn:hover { transform: translateY(-2px); }
        .color-btn.active { border-color: var(--accent-color); box-shadow: 0 0 0 4px rgba(244, 114, 182, 0.25); transform: scale(1.05); }

        .action-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); color: white; border: none; border-radius: 16px; font-size: 1.05rem; cursor: pointer; margin-top: 16px; transition: 0.3s; box-shadow: 0 10px 25px rgba(190, 24, 93, 0.3); font-weight: 400 !important; }
        .action-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(190, 24, 93, 0.4); }
        
        .delete-action-btn { width: 100%; padding: 14px; background: transparent; color: #ef4444; border: 2px solid #fecdd3; border-radius: 16px; font-size: 1rem; cursor: pointer; margin-top: 12px; transition: 0.3s; }
        .delete-action-btn:hover { background: #fff1f2; border-color: #ef4444; }

        .edit-toggle-btn { background: #fff1f2; color: var(--accent-color); border: 1px solid #fbcfe8; padding: 8px 12px; border-radius: 12px; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
        .edit-toggle-btn.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }

        /* ✨ สไตล์การพิมพ์และแบ่งหน้าแยกเนื้อผ้า */
        #print-section { display: none; }
        @media print {
            @page { size: A4 landscape; margin: 8mm; }
            body * { visibility: hidden; }
            #print-section, #print-section * { visibility: visible; }
            #print-section { display: block !important; position: absolute; left: 0; top: 0; width: 100%; background: #fff; color: #000; }
            .print-page { page-break-before: always; }
            .print-page:first-child { page-break-before: auto; }
            .print-table { width: 100%; border-collapse: collapse; font-size: 10px; text-align: center; margin-bottom: 20px; }
            .print-table th, .print-table td { border: 1px solid #000; padding: 4px 2px; }
            .print-table th { background-color: #f2f2f2 !important; -webkit-print-color-adjust: exact; font-weight: bold !important; }
            .print-img { width: 45px; height: 55px; object-fit: cover; display: block; margin: 0 auto; }
            .print-header { text-align: center; margin-bottom: 12px; }
            .print-header h2 { font-size: 16px; font-weight: bold !important; }
        }

        @media screen and (max-width: 600px) {
            .container { padding: 20px 14px; border-radius: 24px; }
            .search-top-row { flex-direction: column; }
            .search-input, .filter-select, .search-btn { width: 100%; }
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .product-img-container { height: 140px; }
            .fabric-chip { padding: 10px 20px; }
            .sort-container { justify-content: space-between; }
            .modal-content { padding: 20px 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-container">
        <h1>✨ Sleepingbox Stock</h1>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchMode('check')">🔍 เช็คสต๊อก</button>
        <button class="tab-btn" onclick="switchMode('update')">📝 เพิ่มสินค้า</button>
    </div>

    <!-- โหมดที่ 1: เช็คและค้นหาสินค้า -->
    <div id="check-mode" class="mode-section active">
        <div class="fabric-categories">
            <button class="fabric-chip active" onclick="selectFabric('ซาติน')">ผ้าซาติน</button>
            <button class="fabric-chip" onclick="selectFabric('ไหม')">ผ้าไหม</button>
            <button class="fabric-chip" onclick="selectFabric('คอตตอน')">ผ้าคอตตอน</button>
            <button class="fabric-chip" onclick="selectFabric('ผ้าย่น')">ผ้าย่น</button>
        </div>

        <div class="search-top-row">
            <input type="text" id="search-keyword" class="search-input" placeholder="🔍 ค้นหาชื่อลาย, สี หรือ SKU..." onkeyup="renderProductsLocally(false)">
            
            <select id="filter-style" class="filter-select" onchange="renderProductsLocally(false)">
                <option value="">ทุกรูปแบบ</option>
                <option value="แขนสั้นขาสั้น">แขนสั้นขาสั้น</option>
                <option value="แขนสั้นขายยาว">แขนสั้นขายยาว</option>
                <option value="แขนยาวขายยาว">แขนยาวขายยาว</option>
                <option value="กระโปรง">กระโปรง</option>
            </select>
            
            <select id="filter-size" class="filter-select" onchange="renderProductsLocally(false)">
                <option value="">ทุกขนาด</option>
                <option value="43">ไซส์ 43</option>
                <option value="48">ไซส์ 48</option>
                <option value="52">ไซส์ 52</option>
                <option value="60">ไซส์ 60</option>
            </select>
        </div>

        <button type="button" class="toggle-advanced-btn" onclick="toggleAdvancedFilter()">
            <span id="toggle-icon">⚙️ เปิดตัวกรองสต๊อกขั้นสูง</span>
        </button>

        <div id="advanced-panel" class="advanced-filter-panel">
            <div class="alert-filter-group">
                <label>เงื่อนไขสต๊อก:</label>
                <div class="operator-group">
                    <button type="button" id="op-lt" class="op-btn active" onclick="setOperator('<')">&lt; น้อยกว่า</button>
                    <button type="button" id="op-gt" class="op-btn" onclick="setOperator('>')">&gt; มากกว่า</button>
                </div>
                <input type="number" id="low-stock-limit" class="alert-input" value="100" min="0">
                <button type="button" class="search-btn" style="padding: 10px 20px; font-size:0.9rem;" onclick="renderProductsLocally(true)">
                    🔥 กรองสต๊อก
                </button>
            </div>
        </div>

        <div class="sort-container">
            <button type="button" class="print-btn" onclick="generatePrintReport()">🖨️ พิมพ์รายงานตารางสต๊อก</button>
            <div style="display: flex; gap: 6px; align-items: center;">
                <button type="button" id="sort-asc" class="sort-btn" onclick="applySort('asc')">🔼 น้อยไปมาก</button>
                <button type="button" id="sort-desc" class="sort-btn" onclick="applySort('desc')">🔽 มากไปน้อย</button>
            </div>
        </div>

        <div class="product-grid" id="product-grid"></div>
    </div>

    <!-- โหมดที่ 2: เพิ่มสินค้าใหม่ -->
    <div id="update-mode" class="mode-section">
        <div class="form-group">
            <label>อัปโหลดรูปภาพสินค้า:</label>
            <input type="file" id="update-image" accept="image/*" onchange="previewImage(event)">
        </div>
        <div class="form-group" id="image-preview-box" style="display:none; text-align: center;">
            <img id="img-preview" src="" alt="Preview" style="max-height: 150px; border-radius: 16px; border: 2px solid #fce7f3; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">
        </div>
        <div class="form-group">
            <label>ชื่อลายสินค้า:</label>
            <input type="text" id="update-pattern" placeholder="เช่น ลายหมี, 8016">
        </div>

        <div class="form-group">
            <label>สี:</label>
            <div class="color-palette">
                <button type="button" class="color-btn active" style="background-color: #ffc0cb; color: #000;" onclick="selectColor('ชมพู', this)">ชมพู</button>
                <button type="button" class="color-btn" style="background-color: #87ceeb; color: #000;" onclick="selectColor('ฟ้า', this)">ฟ้า</button>
                <button type="button" class="color-btn" style="background-color: #ffffff; color: #000;" onclick="selectColor('ขาว', this)">ขาว</button>
                <button type="button" class="color-btn" style="background-color: #000000; color: #fff;" onclick="selectColor('ดำ', this)">ดำ</button>
                <button type="button" class="color-btn" style="background-color: #fdf5e6; color: #000;" onclick="selectColor('ครีม', this)">ครีม</button>
                <button type="button" class="color-btn" style="background-color: #dda0dd; color: #000;" onclick="selectColor('ม่วง', this)">ม่วง</button>
                <button type="button" class="color-btn" style="background-color: #ef4444; color: #fff;" onclick="selectColor('แดง', this)">แดง</button>
                <button type="button" class="color-btn" style="background-color: #000080; color: #fff;" onclick="selectColor('กรม', this)">กรม</button>
                <button type="button" class="color-btn" style="background-color: #ffabe1; color: #000;" onclick="selectColor('โอรส', this)">โอรส</button>
                <button type="button" class="color-btn" style="background-color: #a52a2a; color: #fff;" onclick="selectColor('น้ำตาล', this)">น้ำตาล</button>
                <button type="button" class="color-btn" style="background-color: #86efac; color: #000;" onclick="selectColor('เขียว', this)">เขียว</button>
            </div>
            <input type="text" id="update-color" value="ชมพู" placeholder="หรือพิมพ์ระบุสีเอง..." style="margin-top: 8px;">
        </div>

        <div class="form-group">
            <label>เนื้อผ้า:</label>
            <select name="fabric" id="fabric-select" onchange="generateSKU()">
                <option value="ซาติน">ผ้าซาติน</option>
                <option value="ไหม">ผ้าไหม</option>
                <option value="คอตตอน">ผ้าคอตตอน</option>
                <option value="ผ้าย่น">ผ้าย่น</option>
            </select>
        </div>
        <div class="form-group">
            <label>รูปแบบแขน-ขา:</label>
            <select id="update-style">
                <option value="แขนสั้นขาสั้น">แขนสั้นขาสั้น</option>
                <option value="แขนสั้นขายยาว">แขนสั้นขายยาว</option>
                <option value="แขนยาวขายยาว">แขนยาวขายยาว</option>
                <option value="กระโปรง">กระโปรง</option>
            </select>
        </div>
        <div class="form-group">
            <label>รหัส SKU (สร้างอัตโนมัติ):</label>
            <input type="text" id="generated-sku" style="background: #fff1f2; color: var(--accent-color); font-weight: 500 !important; text-align: center; letter-spacing: 2px;" readonly value="Satin-0000">
        </div>
        <div class="form-group">
            <label>ขนาด:</label>
            <select id="update-size">
                <option value="43">43</option>
                <option value="48">48</option>
                <option value="52">52</option>
                <option value="60">60</option>
            </select>
        </div>
        <div class="form-group">
            <label>จำนวนเริ่มต้น:</label>
            <input type="number" id="update-qty" placeholder="เช่น 10">
        </div>
        <button class="action-btn" onclick="submitUpdate()">✨ บันทึกสินค้าใหม่</button>
    </div>
</div>

<!-- Modal รายละเอียด -->
<div id="stockModal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">&times;</button>
        
        <div class="modal-img-container" id="modal-img-box">
            <span style="color: var(--accent-color); padding: 40px; display: inline-block;">ไม่มีรูปภาพ</span>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; flex-wrap: wrap; gap: 8px;">
            <div style="flex: 1;">
                <div id="view-info-box">
                    <h2 id="modal-title" style="font-size: 1.3rem; color: var(--accent-color); font-weight: 500 !important; margin-bottom: 2px;">ชื่อลาย</h2>
                    <p id="modal-subtitle" style="font-size: 0.85rem; color: var(--primary-hover);"></p>
                </div>
                <div id="edit-info-box" style="display: none; background: #fff1f2; border: 1.5px solid #fbcfe8; padding: 12px; border-radius: 14px; margin-bottom: 10px;">
                    <label style="font-size: 0.85rem; color: var(--accent-color); margin-bottom: 2px;">ชื่อลาย:</label>
                    <input type="text" id="edit-pattern-input" class="search-input" style="width: 100%; margin-bottom: 6px; padding: 8px 12px; font-size: 0.9rem;">
                    <label style="font-size: 0.85rem; color: var(--accent-color); margin-bottom: 2px;">สี:</label>
                    <input type="text" id="edit-color-input" class="search-input" style="width: 100%; margin-bottom: 8px; padding: 8px 12px; font-size: 0.9rem;">
                    <button type="button" class="search-btn" style="padding: 8px; font-size: 0.85rem; width: 100%;" onclick="saveInfoChanges()">💾 บันทึกชื่อและสี</button>
                </div>
            </div>
            
            <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                <button type="button" id="edit-info-btn" class="edit-toggle-btn" onclick="toggleInfoEditMode()">✏️ แก้ชื่อ/สี</button>
                <button type="button" id="edit-mode-btn" class="edit-toggle-btn" onclick="toggleStockEditMode()">✏️ แก้สต๊อก</button>
            </div>
        </div>

        <p style="text-align: right; font-size: 0.75rem; color: #9ca3af; margin-bottom: 4px;">👈 สไลด์ตารางซ้าย-ขวา เพื่อดูไซส์อื่นเพิ่มเติม 👉</p>

        <div class="stock-table-wrapper">
            <table class="stock-table">
                <thead>
                    <tr>
                        <th>รูปแบบ/ไซส์</th>
                        <th>43</th>
                        <th>48</th>
                        <th>52</th>
                        <th>60</th>
                    </tr>
                </thead>
                <tbody id="modal-stock-data"></tbody>
            </table>
        </div>

        <button class="action-btn" onclick="saveStockChanges()" style="margin-top: 18px;">💾 บันทึกสต๊อก</button>
        <button class="delete-action-btn" onclick="confirmDeleteProduct()">🗑️ ลบสินค้านี้</button>
    </div>
</div>

<div id="print-section"></div>
<div id="toast" class="toast">✔️ ทำรายการสำเร็จ</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, deleteDoc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAi8UmPK79Ajf1YTmuV-TgS5k7pDgn3-Ao",
        authDomain: "sleepingbox-store.firebaseapp.com",
        projectId: "sleepingbox-store",
        storageBucket: "sleepingbox-store.firebasestorage.app",
        messagingSenderId: "103888013687",
        appId: "1:103888013687:web:b65485adec7acafdf2b972"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const STYLES = ["แขนสั้นขาสั้น", "แขนสั้นขายยาว", "แขนยาวขายยาว", "กระโปรง"];
    const SIZES = ["43", "48", "52", "60"];
    const FABRICS = ["ซาติน", "ไหม", "คอตตอน", "ผ้าย่น"];

    let productsData = [];
    let currentFabric = "ซาติน";
    let activeSku = "";
    let tempImageBase64 = "";
    let currentOperator = "<";
    let isStockEditable = false;
    let isInfoEditable = false;
    let currentSortOrder = 'default';

    window.showToast = function(message, type="success") {
        const toast = document.getElementById("toast");
        toast.className = "toast show " + type;
        toast.innerHTML = (type === "success" ? "✔️ " : "❌ ") + message;
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2800);
    };

    window.toggleAdvancedFilter = function() {
        const panel = document.getElementById('advanced-panel');
        const iconSpan = document.getElementById('toggle-icon');
        panel.classList.toggle('active');
        iconSpan.innerHTML = panel.classList.contains('active') ? "❌ ปิดตัวกรองสต๊อกขั้นสูง" : "⚙️ เปิดตัวกรองสต๊อกขั้นสูง";
    };

    window.setOperator = function(op) {
        currentOperator = op;
        document.getElementById('op-lt').classList.toggle('active', op === '<');
        document.getElementById('op-gt').classList.toggle('active', op === '>');
    };

    window.switchMode = function(mode) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.mode-section').forEach(sec => sec.classList.remove('active'));
        if(mode === 'check') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('check-mode').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('update-mode').classList.add('active');
            generateSKU();
        }
    };

    window.selectColor = function(colorName, btnElement) {
        document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        document.getElementById('update-color').value = colorName;
    };

    window.generateSKU = async function() {
        const fabric = document.getElementById('fabric-select').value;
        let prefix = fabric === "คอตตอน" ? "CT" : fabric === "ไหม" ? "SILK" : fabric === "ผ้าย่น" ? "AA" : "Satin";
        let unique = false, finalSku = "";
        while (!unique) {
            let randomFour = Math.floor(1000 + Math.random() * 9000);
            finalSku = `${prefix}-${randomFour}`;
            const docSnap = await getDoc(doc(db, "products", finalSku));
            if (!docSnap.exists()) unique = true;
        }
        document.getElementById('generated-sku').value = finalSku;
    };

    window.selectFabric = function(fabric) {
        currentFabric = fabric;
        document.querySelectorAll('.fabric-chip').forEach(chip => {
            chip.classList.toggle('active', chip.innerText.includes(fabric));
        });
        document.getElementById('search-keyword').value = "";
        fetchProductsFromFirebase();
    };

    window.fetchProductsFromFirebase = async function() {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = `<div class="loader-container"><div class="spinner"></div><p style="font-weight:400; color:var(--accent-color);">กำลังโหลดผ้า${currentFabric}...</p></div>`;
        try {
            const q = query(collection(db, "products"), where("fabric", "==", currentFabric));
            const querySnapshot = await getDocs(q);
            productsData = [];
            querySnapshot.forEach((docSnap) => { productsData.push(docSnap.data()); });
            renderProductsLocally(false);
        } catch (error) {
            showToast("เชื่อมต่อฐานข้อมูลล้มเหลว", "error");
            grid.innerHTML = `<p style="text-align:center; color:red; grid-column: 1/-1;">❌ โหลดข้อมูลไม่สำเร็จ</p>`;
        }
    };

    window.previewImage = function(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.src = e.target.result;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width, height = img.height, maxWidth = 500; 
                if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                canvas.width = width; canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                tempImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                document.getElementById('img-preview').src = tempImageBase64;
                document.getElementById('image-preview-box').style.display = 'block';
            }
        };
        reader.readAsDataURL(file);
    };

    window.applySort = function(order) {
        if (currentSortOrder === order) {
            currentSortOrder = 'default';
        } else {
            currentSortOrder = order;
        }
        
        document.getElementById('sort-asc').classList.toggle('active', currentSortOrder === 'asc');
        document.getElementById('sort-desc').classList.toggle('active', currentSortOrder === 'desc');
        
        const isAdvancedFilterActive = document.getElementById('advanced-panel').classList.contains('active');
        renderProductsLocally(isAdvancedFilterActive);
    };

    window.renderProductsLocally = function(isStockFilterActive = false) {
        const keyword = document.getElementById('search-keyword').value.trim().toLowerCase();
        const styleFilter = document.getElementById('filter-style').value;
        const sizeFilter = document.getElementById('filter-size').value;
        const limitVal = parseInt(document.getElementById('low-stock-limit').value) || 0;

        let mappedProducts = productsData.map(p => {
            if (!p) return null;
            const hay = [(p['ชื่อลาย'] || ''), (p['สี'] || ''), (p['SKU'] || '')].join(' ').toLowerCase();
            const matchKeyword = !keyword || hay.includes(keyword);

            let targetTotal = 0;
            STYLES.forEach(style => {
                if (styleFilter && style !== styleFilter) return;
                SIZES.forEach(size => { 
                    if (sizeFilter && size !== sizeFilter) return;
                    targetTotal += parseInt(p[`${style} ${size}`]) || 0; 
                });
            });

            let matchStock = true;
            if (isStockFilterActive) {
                matchStock = currentOperator === '<' ? (targetTotal < limitVal) : (targetTotal > limitVal);
            } else if ((styleFilter || sizeFilter) && targetTotal <= 0) {
                matchStock = false;
            }
            
            if (matchKeyword && matchStock) {
                return { data: p, totalStock: targetTotal };
            }
            return null;
        }).filter(item => item !== null);

        if (currentSortOrder === 'asc') {
            mappedProducts.sort((a, b) => a.totalStock - b.totalStock);
        } else if (currentSortOrder === 'desc') {
            mappedProducts.sort((a, b) => b.totalStock - a.totalStock);
        }

        const grid = document.getElementById('product-grid');
        grid.innerHTML = "";
        
        if (mappedProducts.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px; color:#9ca3af;"><div style="font-size:3rem; margin-bottom:10px;">🍃</div><p>ไม่พบสินค้าที่ตรงกับการค้นหา</p></div>`;
            return;
        }

        mappedProducts.forEach((item, index) => {
            const p = item.data;
            const total = item.totalStock;
            const name = p['ชื่อลาย'] || ('SKU ' + (p['SKU'] || '-'));
            
            let badge = total <= 0 ? `<div class="out-of-stock-badge">หมด</div>` : `<div class="low-stock-badge">รวม ${total} ชุด</div>`;
            let img = p['รูปภาพสินค้า'] ? `<img src="${p['รูปภาพสินค้า']}" loading="lazy">` : `📸 รูปภาพ`;
            
            grid.innerHTML += `
                <div class="product-card" style="animation-delay: ${index * 0.03}s" onclick="openStockModal('${p['SKU']}', '${name.replace(/'/g, "\\'")}')">
                    <div class="product-img-container">${badge}${img}</div>
                    <div class="product-info">
                        <div class="product-name">${name}</div>
                        <div class="product-fabric">สี: ${p['สี'] || '-'} | SKU: ${p['SKU']}</div>
                    </div>
                </div>`;
        });
    }

    // ✨ ฟังก์ชันพิมพ์รายงานแบบแยกชนิดเนื้อผ้าไว้คนละหน้าอัตโนมัติ
    window.generatePrintReport = async function() {
        showToast("กำลังเตรียมรายงานแยกหน้า...", "success");
        try {
            const querySnapshot = await getDocs(collection(db, "products"));
            let allProducts = [];
            querySnapshot.forEach(docSnap => allProducts.push(docSnap.data()));

            if (allProducts.length === 0) {
                showToast("ไม่มีข้อมูลสินค้าในระบบ", "error");
                return;
            }

            const columns = [
                "แขนสั้นขาสั้น 43", "แขนสั้นขายยาว 43", "แขนยาวขายยาว 43", 
                "แขนสั้นขาสั้น 48", "แขนสั้นขายยาว 48", "แขนยาวขายยาว 48", 
                "แขนสั้นขาสั้น 52", "แขนสั้นขายยาว 52", "แขนยาวขายยาว 52", 
                "กระโปรง 43", "กระโปรง 48", "กระโปรง 52", "กระโปรง 60"
            ];

            let fullHTML = "";
            const printDate = `${new Date().toLocaleDateString('th-TH')} ${new Date().toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'})}`;

            FABRICS.forEach(fabricName => {
                let items = allProducts.filter(p => p.fabric === fabricName);
                if (items.length > 0) {
                    fullHTML += `
                        <div class="print-page">
                            <div class="print-header">
                                <h2>รายงานตารางสต๊อก - ผ้า${fabricName}</h2>
                                <p style="font-size: 11px; margin-top:2px;">พิมพ์เมื่อ: ${printDate}</p>
                            </div>
                            <table class="print-table">
                                <thead>
                                    <tr>
                                        <th style="width: 50px;">รูปภาพ</th>
                                        <th style="width: 55px;">SKU</th>
                                        <th style="width: 45px;">สี</th>
                                        ${columns.map(col => `<th>${col}</th>`).join('')}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${items.map(p => `
                                        <tr>
                                            <td>${p['รูปภาพสินค้า'] ? `<img src="${p['รูปภาพสินค้า']}" class="print-img">` : `-`}</td>
                                            <td><b>${p['SKU'] || '-'}</b></td>
                                            <td>${p['สี'] || '-'}</td>
                                            ${columns.map(col => `<td>${(p[col] !== undefined && p[col] > 0) ? p[col] : ''}</td>`).join('')}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>`;
                }
            });

            const printArea = document.getElementById('print-section');
            printArea.innerHTML = fullHTML;
            setTimeout(() => window.print(), 500);

        } catch (error) {
            showToast("ไม่สามารถสร้างรายงานได้", "error");
        }
    };

    window.openStockModal = function(sku, displayName) {
        activeSku = sku;
        isStockEditable = false;
        isInfoEditable = false;
        
        document.getElementById('edit-mode-btn').classList.remove('active');
        document.getElementById('edit-mode-btn').innerText = "✏️ แก้สต๊อก";
        document.getElementById('edit-info-btn').classList.remove('active');
        document.getElementById('edit-info-btn').innerText = "✏️ แก้ชื่อ/สี";
        document.getElementById('edit-info-box').style.display = 'none';
        document.getElementById('view-info-box').style.display = 'block';

        const product = productsData.find(p => p && String(p['SKU']) === String(sku)) || {};
        const patternName = product['ชื่อลาย'] || displayName || '';
        const colorName = product['สี'] || '';

        document.getElementById('modal-title').innerText = patternName;
        document.getElementById('modal-subtitle').innerText = `ผ้า: ${currentFabric} | สี: ${colorName} | SKU: ${sku}`;
        document.getElementById('edit-pattern-input').value = patternName;
        document.getElementById('edit-color-input').value = colorName;

        const imgBox = document.getElementById('modal-img-box');
        imgBox.innerHTML = product['รูปภาพสินค้า'] ? `<img src="${product['รูปภาพสินค้า']}">` : `<span style="color: var(--accent-color); padding: 40px; display: inline-block;">ไม่มีรูปภาพ</span>`;

        const tbody = document.getElementById('modal-stock-data');
        tbody.innerHTML = "";
        STYLES.forEach(style => {
            let row = `<tr><td><b>${style}</b></td>`;
            SIZES.forEach(size => {
                let qty = product[`${style} ${size}`] || 0;
                row += `<td><input type="number" class="stock-input" data-key="${style} ${size}" value="${qty}" readonly></td>`;
            });
            tbody.innerHTML += row + `</tr>`;
        });
        document.getElementById('stockModal').style.display = 'flex';
    };

    window.toggleStockEditMode = function() {
        isStockEditable = !isStockEditable;
        const btn = document.getElementById('edit-mode-btn');
        btn.classList.toggle('active', isStockEditable);
        btn.innerText = isStockEditable ? "🔒 ล็อกสต๊อก" : "✏️ แก้สต๊อก";
        document.querySelectorAll('.stock-input').forEach(input => {
            input.classList.toggle('editable', isStockEditable);
            if (isStockEditable) input.removeAttribute('readonly'); else input.setAttribute('readonly', 'true');
        });
    };

    window.toggleInfoEditMode = function() {
        isInfoEditable = !isInfoEditable;
        const btn = document.getElementById('edit-info-btn');
        btn.classList.toggle('active', isInfoEditable);
        btn.innerText = isInfoEditable ? "🔒 ปิดการแก้" : "✏️ แก้ชื่อ/สี";
        document.getElementById('edit-info-box').style.display = isInfoEditable ? 'block' : 'none';
        document.getElementById('view-info-box').style.display = isInfoEditable ? 'none' : 'block';
    };

    window.saveInfoChanges = async function() {
        const newPattern = document.getElementById('edit-pattern-input').value.trim();
        const newColor = document.getElementById('edit-color-input').value.trim();
        if (!newPattern) { showToast("กรุณากรอกชื่อลาย", "error"); return; }

        try {
            await updateDoc(doc(db, "products", String(activeSku)), { 'ชื่อลาย': newPattern, 'สี': newColor });
            showToast("อัปเดตชื่อและสีสำเร็จ!");
            document.getElementById('modal-title').innerText = newPattern;
            document.getElementById('modal-subtitle').innerText = `ผ้า: ${currentFabric} | สี: ${newColor} | SKU: ${activeSku}`;
            toggleInfoEditMode();
            fetchProductsFromFirebase();
        } catch (error) { showToast("ไม่สามารถบันทึกได้", "error"); }
    };

    window.saveStockChanges = async function() {
        if (!confirm("บันทึกจำนวนสต๊อกใช่หรือไม่?")) return;
        let updateData = {};
        document.querySelectorAll('.stock-input').forEach(input => { updateData[input.getAttribute('data-key')] = parseInt(input.value) || 0; });
        const now = new Date();
        updateData['updatedAt'] = `${now.toLocaleDateString('th-TH')} ${now.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'})}`;

        try {
            await updateDoc(doc(db, "products", String(activeSku)), updateData);
            showToast("บันทึกสต๊อกเรียบร้อย!");
            closeModal();
            fetchProductsFromFirebase(); 
        } catch (error) { showToast("ไม่สามารถบันทึกได้", "error"); }
    };

    window.confirmDeleteProduct = async function() {
        if (confirm(`ลบสินค้ารหัส ${activeSku} ใช่หรือไม่?\n(ลบแล้วกู้คืนไม่ได้)`)) {
            try {
                await deleteDoc(doc(db, "products", String(activeSku)));
                showToast("ลบสินค้าสำเร็จ!");
                closeModal();
                fetchProductsFromFirebase();
            } catch (error) { showToast("ลบสินค้าไม่สำเร็จ", "error"); }
        }
    };

    window.closeModal = function() { document.getElementById('stockModal').style.display = 'none'; };

    window.submitUpdate = async function() {
        const pattern = document.getElementById('update-pattern').value.trim();
        const color = document.getElementById('update-color').value.trim();
        const fabric = document.getElementById('fabric-select').value;
        const style = document.getElementById('update-style').value;
        const sku = document.getElementById('generated-sku').value;
        const qty = parseInt(document.getElementById('update-qty').value) || 0;
        if (!pattern) { showToast("กรุณากรอกชื่อลาย", "error"); return; }

        let newProd = { 'SKU': sku, 'ชื่อลาย': pattern, 'สี': color, 'fabric': fabric, 'รูปภาพสินค้า': tempImageBase64 };
        STYLES.forEach(s => SIZES.forEach(sz => newProd[`${s} ${sz}`] = (s === style && sz === document.getElementById('update-size').value) ? qty : 0));

        try {
            await setDoc(doc(db, "products", String(sku)), newProd);
            showToast(`เพิ่มสินค้าสำเร็จ! (SKU: ${sku})`);
            document.getElementById('update-pattern').value = '';
            document.getElementById('update-qty').value = '';
            document.getElementById('update-image').value = '';
            document.getElementById('image-preview-box').style.display = 'none';
            tempImageBase64 = "";
            generateSKU();
            switchMode('check');
        } catch (error) { showToast("บันทึกไม่สำเร็จ", "error"); }
    };

    window.onload = () => fetchProductsFromFirebase();

</script>
