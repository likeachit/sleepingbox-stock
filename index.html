<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleepingbox Stock</title>
    <!-- Google Fonts: Mitr -->
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Mitr', sans-serif;
            background-color: #fff5f7;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-4xl rounded-3xl shadow-xl p-8 border border-pink-100">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🎀</span>
                <h1 class="text-2xl font-medium text-pink-600">Sleepingbox Stock</h1>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <button onclick="switchTab('check')" id="btn-check" class="flex items-center justify-center gap-2 py-3 px-4 rounded-2xl bg-pink-50 text-pink-600 font-medium transition shadow-sm border border-pink-200">
                🔍 เช็คสต็อกสินค้า
            </button>
            <button onclick="switchTab('add')" id="btn-add" class="flex items-center justify-center gap-2 py-3 px-4 rounded-2xl bg-white text-gray-500 font-medium transition hover:bg-pink-50 border border-gray-100">
                📝 เพิ่มสินค้าใหม่
            </button>
        </div>

        <!-- TAB 1: เช็คสต็อก -->
        <div id="tab-check" class="space-y-6">
            <!-- เลือกเนื้อผ้า -->
            <div class="flex flex-wrap gap-2" id="fabric-filters">
                <button onclick="selectFabric('ผ้าซาติน', this)" class="fabric-btn py-2 px-5 rounded-full bg-pink-500 text-white font-medium transition shadow-sm">ผ้าซาติน</button>
                <button onclick="selectFabric('ผ้าไหม', this)" class="fabric-btn py-2 px-5 rounded-full bg-pink-50 text-pink-600 font-medium transition hover:bg-pink-100">ผ้าไหม</button>
                <button onclick="selectFabric('ผ้าคอตตอน', this)" class="fabric-btn py-2 px-5 rounded-full bg-pink-50 text-pink-600 font-medium transition hover:bg-pink-100">ผ้าคอตตอน</button>
                <button onclick="selectFabric('ผ้าหย่น', this)" class="fabric-btn py-2 px-5 rounded-full bg-pink-50 text-pink-600 font-medium transition hover:bg-pink-100">ผ้าหย่น</button>
            </div>

            <!-- ช่องค้นหา -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-2 relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">🔍</span>
                    <input type="text" id="search-keyword" placeholder="ค้นหาชื่อลาย, สี หรือ SKU..." class="w-full pl-11 pr-4 py-3 rounded-2xl border border-gray-200 focus:outline-none focus:border-pink-400 transition">
                </div>
                <div>
                    <select id="search-size" class="w-full py-3 px-4 rounded-2xl border border-gray-200 focus:outline-none focus:border-pink-400 transition bg-white">
                        <option value="">ทุกขนาด</option>
                        <option value="S">S</option>
                        <option value="M">M</option>
                        <option value="L">L</option>
                        <option value="XL">XL</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-end">
                <button onclick="searchStock()" class="bg-pink-400 hover:bg-pink-500 text-white py-3 px-8 rounded-2xl font-medium transition shadow-md flex items-center gap-2">
                    🔍 ค้นหา
                </button>
            </div>

            <!-- ผลการค้นหา / รายการสินค้า -->
            <div id="stock-results" class="mt-6 border-t border-gray-100 pt-6 text-center text-gray-400">
                🌸 กรุณาเลือกเนื้อผ้าและกดปุ่ม "ค้นหา" เพื่อแสดงรายการสินค้า
            </div>
        </div>

        <!-- TAB 2: เพิ่มสินค้าใหม่ -->
        <div id="tab-add" class="hidden space-y-6">
            <form onsubmit="addProduct(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">เนื้อผ้า</label>
                        <select id="add-fabric" required class="w-full py-3 px-4 rounded-2xl border border-gray-200 focus:outline-none focus:border-pink-400 bg-white">
                            <option value="ผ้าซาติน">ผ้าซาติน</option>
                            <option value="ผ้าไหม">ผ้าไหม</option>
                            <option value="ผ้าคอตตอน">ผ้าคอตตอน</option>
                            <option value="ผ้าหย่น">ผ้าหย่น</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">SKU / รหัสสินค้า</label>
                        <input type="text" id="add-sku" required placeholder="เช่น SAT-001" class="w-full py-3 px-4 rounded-2xl border border-gray-200 focus:outline-none focus:border-pink-400">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">ชื่อลาย / สี</label>
                        <input type="text" id="add-name" required placeholder="เช่น ลายดอกไม้สีชมพู" class="w-full py-3 px-4 rounded-2xl border border-gray-200 focus:outline-none focus:border-pink-400">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">ขนาด</label>
                        <select id="add-size" required class="w-full py-3 px-4 rounded-2xl border border-gray-200 focus:outline-none focus:border-pink-400 bg-white">
                            <option value="S">S</option>
                            <option value="M">M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">จำนวนสต๊อกเริ่มต้น</label>
                    <input type="number" id="add-qty" required min="0" value="0" class="w-full py-3 px-4 rounded-2xl border border-gray-200 focus:outline-none focus:border-pink-400">
                </div>

                <div class="flex justify-end pt-4">
                    <button type="submit" class="bg-pink-500 hover:bg-pink-600 text-white py-3 px-8 rounded-2xl font-medium transition shadow-md">
                        💾 บันทึกสินค้าใหม่
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addData, getDocs, query, where, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Config ของคุณ
        const firebaseConfig = {
            apiKey: "AIzaSyAi8UmPK79Ajf1YTmuV-TgS5k7pDgn3-Ao",
            authDomain: "sleepingbox-store.firebaseapp.com",
            projectId: "sleepingbox-store",
            storageBucket: "sleepingbox-store.firebasestorage.app",
            messagingSenderId: "103888013687",
            appId: "1:103888013687:web:b65485adec7acafdf2b972",
            measurementId: "G-YWZK92XG7N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let selectedFabric = "ผ้าซาติน";

        window.switchTab = function(tab) {
            if (tab === 'check') {
                document.getElementById('tab-check').classList.remove('hidden');
                document.getElementById('tab-add').classList.add('hidden');
                document.getElementById('btn-check').className = "flex items-center justify-center gap-2 py-3 px-4 rounded-2xl bg-pink-50 text-pink-600 font-medium transition shadow-sm border border-pink-200";
                document.getElementById('btn-add').className = "flex items-center justify-center gap-2 py-3 px-4 rounded-2xl bg-white text-gray-500 font-medium transition hover:bg-pink-50 border border-gray-100";
            } else {
                document.getElementById('tab-check').classList.add('hidden');
                document.getElementById('tab-add').classList.remove('hidden');
                document.getElementById('btn-add').className = "flex items-center justify-center gap-2 py-3 px-4 rounded-2xl bg-pink-50 text-pink-600 font-medium transition shadow-sm border border-pink-200";
                document.getElementById('btn-check').className = "flex items-center justify-center gap-2 py-3 px-4 rounded-2xl bg-white text-gray-500 font-medium transition hover:bg-pink-50 border border-gray-100";
            }
        };

        window.selectFabric = function(fabric, btn) {
            selectedFabric = fabric;
            document.querySelectorAll('.fabric-btn').forEach(b => {
                b.className = "fabric-btn py-2 px-5 rounded-full bg-pink-50 text-pink-600 font-medium transition hover:bg-pink-100";
            });
            btn.className = "fabric-btn py-2 px-5 rounded-full bg-pink-500 text-white font-medium transition shadow-sm";
        };

        // ฟังก์ชันค้นหาสต๊อกใน Firebase
        window.searchStock = async function() {
            const keyword = document.getElementById('search-keyword').value.trim().toLowerCase();
            const size = document.getElementById('search-size').value;
            const resultsDiv = document.getElementById('stock-results');

            resultsDiv.innerHTML = `<p class="text-gray-400">กำลังค้นหาข้อมูล...</p>`;

            try {
                const q = query(collection(db, "products"), where("fabric", "==", selectedFabric));
                const querySnapshot = await getDocs(q);
                
                let html = '';
                let items = [];

                querySnapshot.forEach((doc) => {
                    let data = doc.data();
                    // กรองตามคำค้นหาและขนาดฝั่ง Client
                    let matchKeyword = !keyword || (data.name && data.name.toLowerCase().includes(keyword)) || (data.sku && data.sku.toLowerCase().includes(keyword));
                    let matchSize = !size || data.size === size;

                    if (matchKeyword && matchSize) {
                        items.push(data);
                    }
                });

                if (items.length === 0) {
                    resultsDiv.innerHTML = `<p class="text-gray-400">ไม่พบสินค้าที่คุณค้นหา</p>`;
                    return;
                }

                html = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-left">`;
                items.forEach(item => {
                    html += `
                        <div class="p-4 rounded-2xl border border-pink-100 bg-pink-50/30 flex justify-between items-center">
                            <div>
                                <p class="font-medium text-gray-800">${item.name} <span class="text-xs text-pink-500 bg-pink-100 px-2 py-0.5 rounded-full">${item.sku}</span></p>
                                <p class="text-sm text-gray-500">เนื้อผ้า: ${item.fabric} | ขนาด: ${item.size}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-lg font-semibold text-pink-600">${item.qty}</span>
                                <p class="text-xs text-gray-400">ชิ้น</p>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                resultsDiv.innerHTML = html;

            } catch (error) {
                console.error("Error searching: ", error);
                resultsDiv.innerHTML = `<p class="text-red-400">เกิดข้อผิดพลาดในการดึงข้อมูล</p>`;
            }
        };

        // ฟังก์ชันเพิ่มสินค้าใหม่ลง Firebase
        window.addProduct = async function(event) {
            event.preventDefault();
            
            const fabric = document.getElementById('add-fabric').value;
            const sku = document.getElementById('add-sku').value.trim();
            const name = document.getElementById('add-name').value.trim();
            const size = document.getElementById('add-size').value;
            const qty = parseInt(document.getElementById('add-qty').value);

            try {
                await addDoc(collection(db, "products"), {
                    fabric: fabric,
                    sku: sku,
                    name: name,
                    size: size,
                    qty: qty,
                    createdAt: new Date()
                });

                alert("บันทึกสินค้าใหม่สำเร็จ! 🎉");
                document.querySelector('form').reset();
                switchTab('check');
            } catch (error) {
                console.error("Error adding product: ", error);
                alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล");
            }
        };
    </script>
</body>
</html>
