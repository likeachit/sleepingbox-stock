<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleepingbox - สินค้าพร้อมส่ง</title>
    <!-- เปลี่ยนฟอนต์เป็น Noto Sans Thai ให้เหมือนกัน -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ใช้ธีมสีเดียวกันกับหน้า Admin 100% */
        :root { 
            --primary-color: #f9a8d4; 
            --primary-hover: #f472b6; 
            --bg-color: #fff0f5; 
            --card-bg: #ffffff; 
            --text-color: #57534e; 
            --border-color: #fce7f3; 
            --accent-color: #d81b60; 
            --line-green: #06c755; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Thai', sans-serif !important; font-weight: 300 !important; }
        h1, h2, h3, b, strong, .font-bold { font-weight: 500 !important; }
        
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px 12px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .container { width: 100%; max-width: 800px; background: var(--card-bg); padding: 28px 20px; border-radius: 36px; box-shadow: 0 15px 35px -5px rgba(249, 168, 212, 0.3); border: 2px solid #fff; }
        
        .header-container { text-align: center; margin-bottom: 24px; }
        h1 { font-size: 1.8rem; color: var(--accent-color); letter-spacing: 0.5px; }
        p.subtitle { font-size: 0.95rem; color: var(--primary-hover); margin-top: 4px; font-weight: 400 !important; }
        
        .fabric-categories { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
        .fabric-categories::-webkit-scrollbar { display: none; }
        .fabric-chip { padding: 10px 24px; background: #fff; border: 2px solid var(--border-color); border-radius: 30px; cursor: pointer; white-space: nowrap; transition: 0.3s; color: var(--accent-color); font-size: 0.95rem; font-weight: 400 !important; }
        .fabric-chip.active { background: var(--accent-color); color: white; border-color: var(--accent-color); box-shadow: 0 6px 15px rgba(216, 27, 96, 0.3); transform: scale(1.05); font-weight: 500 !important; }
        
        .search-top-row { display: flex; gap: 10px; margin-bottom: 24px; align-items: center; flex-wrap: wrap; }
        .search-input, .filter-select { padding: 12px 18px; border: 2px solid var(--border-color); border-radius: 24px; font-size: 0.95rem; outline: none; background: #fafaf9; transition: 0.3s; color: var(--text-color); }
        .search-input { flex: 2; min-width: 160px; }
        .filter-select { flex: 1; min-width: 110px; cursor: pointer; }
        .search-input:focus, .filter-select:focus { border-color: var(--primary-color); background: #fff; box-shadow: 0 0 0 4px rgba(249, 168, 212, 0.2); }
        .search-btn { background: linear-gradient(135deg, var(--primary-hover), var(--accent-color)); color: white; border: none; padding: 12px 24px; border-radius: 24px; font-size: 0.95rem; cursor: pointer; white-space: nowrap; transition: 0.3s; box-shadow: 0 6px 15px rgba(216, 27, 96, 0.2); font-weight: 400 !important; }
        .search-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(216, 27, 96, 0.3); }
        
        /* การ์ดสินค้า */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
        .product-card { background: #ffffff; border: 2px solid var(--border-color); border-radius: 24px; overflow: hidden; cursor: pointer; transition: 0.3s; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 15px 25px rgba(249, 168, 212, 0.4); border-color: var(--primary-hover); }
        .product-img-container { width: 100%; height: 200px; background: #fdf2f8; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .product-img-container img, .modal-img-container img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s ease; }
        .product-card:hover .product-img-container img { transform: scale(1.06); }
        
        .stock-badge { position: absolute; top: 12px; right: 12px; padding: 4px 12px; font-size: 0.75rem; border-radius: 12px; color: white; font-weight: 500 !important; backdrop-filter: blur(4px); }
        .badge-instock { background: rgba(16, 185, 129, 0.9); box-shadow: 0 2px 8px rgba(16,185,129,0.3); }
        .badge-outstock { background: rgba(244, 63, 94, 0.9); box-shadow: 0 2px 8px rgba(244,63,94,0.3); }
        
        .product-info { padding: 16px; text-align: center; }
        .product-name { font-size: 1.05rem; margin-bottom: 2px; color: var(--accent-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500 !important; }
        .product-details { font-size: 0.85rem; color: #9d174d; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,240,245,0.7); backdrop-filter: blur(8px); justify-content: center; align-items: center; padding: 12px; z-index: 1000; }
        .modal-content { background: white; width: 100%; max-width: 520px; padding: 26px 16px; border-radius: 36px; position: relative; max-height: 90vh; overflow-y: auto; border: 2px solid var(--border-color); box-shadow: 0 20px 50px rgba(249, 168, 212, 0.3); }
        .close-btn { position: absolute; top: 16px; right: 16px; font-size: 1.5rem; cursor: pointer; border: none; background: #fff1f2; color: var(--accent-color); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10; transition: 0.2s;}
        .close-btn:hover { background: var(--accent-color); color: white; }
        
        .modal-img-container { width: 100%; max-height: 280px; border-radius: 24px; overflow: hidden; background: #fdf2f8; text-align: center; margin-bottom: 12px; position: relative; cursor: zoom-in; border: 2px solid var(--border-color); }
        .modal-img-container img { max-height: 280px; width: auto; object-fit: contain; }
        .zoom-badge { position: absolute; bottom: 10px; right: 10px; background: rgba(216, 27, 96, 0.7); color: #ffffff; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; display: flex; gap: 4px; backdrop-filter: blur(4px); font-weight: 400 !important; }
        
        .thumbnail-container { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .thumbnail-container::-webkit-scrollbar { display: none; }
        .thumbnail-img { width: 55px; height: 55px; border-radius: 16px; object-fit: cover; border: 2px solid var(--border-color); cursor: pointer; transition: 0.2s; opacity: 0.6; }
        .thumbnail-img:hover { opacity: 1; border-color: var(--primary-hover); }
        .thumbnail-img.active { border-color: var(--accent-color); opacity: 1; transform: scale(1.05); }

        .image-lightbox { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255,240,245,0.9); z-index: 2000; justify-content: center; align-items: center; padding: 16px; backdrop-filter: blur(5px); }
        .image-lightbox img { max-width: 90vw; max-height: 88vh; object-fit: contain; border-radius: 24px; border: 2px solid #fff; box-shadow: 0 10px 30px rgba(216,27,96,0.2); }
        
        .lightbox-actions { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 2010; }
        .lightbox-btn { color: var(--accent-color); font-size: 1.4rem; cursor: pointer; background: #fff; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.2s; border: none; box-shadow: 0 4px 10px rgba(216,27,96,0.2); }
        .lightbox-btn:hover { background: var(--primary-hover); color: white; transform: scale(1.05); }

        .stock-table-wrapper { border-radius: 20px; border: 2px solid var(--border-color); width: 100%; overflow-x: auto; margin: 12px 0; }
        .stock-table { width: 100%; border-collapse: collapse; min-width: 440px; }
        .stock-table th, .stock-table td { border: 1px solid var(--border-color); padding: 10px 4px; text-align: center; font-size: 0.9rem; }
        .stock-table th { background: #fff1f2; color: var(--accent-color); font-weight: 500 !important; }
        .qty-has { color: #10b981; font-weight: 500 !important; }
        .qty-none { color: #d1d5db; }
        
        /* ปุ่ม LINE ซื้อสินค้า */
        .line-buy-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #00c300, #009900); color: white; border: none; border-radius: 24px; font-size: 1.05rem; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 400 !important; box-shadow: 0 6px 15px rgba(0, 195, 0, 0.3); transition: 0.3s; }
        .line-buy-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 195, 0, 0.4); }
        
        .loader-container { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--primary-hover); }
        .spinner { width: 44px; height: 44px; border: 4px solid var(--border-color); border-top: 4px solid var(--primary-hover); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        @media screen and (max-width: 600px) { .container { padding: 24px 16px; border-radius: 28px; } .product-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } .product-img-container { height: 160px; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header-container">
        <h1>✨ Sleepingbox Catalog</h1>
        <p class="subtitle">เลือกชมสินค้าและเช็คสต๊อกพร้อมส่งได้เลยค่ะ 💖</p>
    </div>

    <div class="fabric-categories">
        <button class="fabric-chip active" onclick="selectFabric('ซาติน')">ผ้าซาติน</button>
        <button class="fabric-chip" onclick="selectFabric('ไหม')">ผ้าไหม</button>
        <button class="fabric-chip" onclick="selectFabric('คอตตอน')">ผ้าคอตตอน</button>
        <button class="fabric-chip" onclick="selectFabric('ผ้าย่น')">ผ้าย่น</button>
    </div>

    <div class="search-top-row">
        <input type="text" id="search-keyword" class="search-input" placeholder="🔍 พิมพ์ค้นหาชื่อลาย หรือ สี..." onkeydown="handleSearchKeyPress(event)">
        <select id="filter-style" class="filter-select"><option value="">ทุกรูปแบบ</option><option value="แขนสั้นขาสั้น">แขนสั้นขาสั้น</option><option value="แขนสั้นขายยาว">แขนสั้นขายยาว</option><option value="แขนยาวขายยาว">แขนยาวขายยาว</option><option value="กระโปรง">กระโปรง</option></select>
        <select id="filter-size" class="filter-select"><option value="">ทุกไซส์</option><option value="43">ไซส์ 43</option><option value="48">ไซส์ 48</option><option value="52">ไซส์ 52</option><option value="60">ไซส์ 60</option></select>
        <button type="button" class="search-btn" onclick="triggerSearch()">🔍 ค้นหา</button>
    </div>

    <div class="product-grid" id="product-grid"></div>
</div>

<div id="stockModal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">&times;</button>
        
        <div class="modal-img-container" id="modal-img-box" onclick="openLightbox()"></div>
        <div id="modal-thumbnail-box" class="thumbnail-container"></div>

        <div style="text-align: center; margin-bottom: 16px;">
            <h2 id="modal-title" style="font-size: 1.4rem; color: var(--accent-color); font-weight: 500 !important;">ชื่อลาย</h2>
            <p id="modal-subtitle" style="font-size: 0.9rem; color: var(--primary-hover); margin-top: 2px;"></p>
        </div>

        <p style="text-align: center; font-size: 0.85rem; color: #6b7280; margin-bottom: 8px;">จำนวนสินค้าพร้อมส่งตามรูปแบบและไซส์:</p>
        <div class="stock-table-wrapper">
            <table class="stock-table">
                <thead><tr><th>รูปแบบ/ไซส์</th><th>43</th><th>48</th><th>52</th><th>60</th></tr></thead>
                <tbody id="modal-stock-data"></tbody>
            </table>
        </div>
        <a id="line-order-link" href="#" target="_blank" class="line-buy-btn">💬 สนใจสั่งซื้อ / สอบถามทาง LINE</a>
    </div>
</div>

<div id="imageLightbox" class="image-lightbox" onclick="closeLightbox()">
    <div class="lightbox-actions">
        <a id="lightbox-download-btn" href="#" target="_blank" class="lightbox-btn" title="ดาวน์โหลดรูปภาพ" onclick="event.stopPropagation()">📥</a>
        <button class="lightbox-btn" onclick="closeLightbox()" title="ปิด">&times;</button>
    </div>
    <img id="lightbox-img" src="" onclick="event.stopPropagation()">
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyAi8UmPK79Ajf1YTmuV-TgS5k7pDgn3-Ao", authDomain: "sleepingbox-store.firebaseapp.com", projectId: "sleepingbox-store", storageBucket: "sleepingbox-store.firebasestorage.app", messagingSenderId: "103888013687", appId: "1:103888013687:web:b65485adec7acafdf2b972" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app);
    const STYLES = ["แขนสั้นขาสั้น", "แขนสั้นขายยาว", "แขนยาวขายยาว", "กระโปรง"]; const SIZES = ["43", "48", "52", "60"];
    const LINE_OA_URL = "https://line.me/R/ti/p/@sleepingbox"; 

    let productsData = []; let currentFabric = "ซาติน"; let currentActiveImgSrc = "";

    window.selectFabric = function(f) { currentFabric = f; document.querySelectorAll('.fabric-chip').forEach(c => c.classList.toggle('active', c.innerText.includes(f))); document.getElementById('search-keyword').value = ""; fetchProductsFromFirebase(); };
    window.fetchProductsFromFirebase = async function() { const grid = document.getElementById('product-grid'); grid.innerHTML = `<div class="loader-container"><div class="spinner"></div><p>กำลังโหลด...</p></div>`; try { const q = query(collection(db, "products"), where("fabric", "==", currentFabric)); const qs = await getDocs(q); productsData = []; qs.forEach(d => productsData.push(d.data())); renderProductsLocally(); } catch(e) { grid.innerHTML = `<p style="text-align:center;color:red;grid-column:1/-1;">❌ โหลดข้อมูลไม่สำเร็จ</p>`; } };
    window.handleSearchKeyPress = function(e) { if(e.key === 'Enter') triggerSearch(); };
    window.triggerSearch = function() { renderProductsLocally(); };

    function getDisplayCoverImage(pData) {
        if (!pData) return null;
        if (pData['coverImage']) return pData['coverImage'];
        let imgs = pData['รูปภาพสินค้า'];
        if (Array.isArray(imgs)) return imgs.length > 0 ? imgs[0] : null;
        return imgs || null;
    }

    window.renderProductsLocally = function() {
        const kw = document.getElementById('search-keyword').value.trim().toLowerCase(), st = document.getElementById('filter-style').value, sz = document.getElementById('filter-size').value;
        let filtered = productsData.filter(p => {
            if(!p) return false; const hay = [(p['ชื่อลาย']||''), (p['สี']||''), (p['SKU']||'')].join(' ').toLowerCase(); let total = 0;
            STYLES.forEach(s => { if(st && s!==st) return; SIZES.forEach(z => { if(sz && z!==sz) return; total += parseInt(p[`${s} ${z}`])||0; }); });
            return (!kw || hay.includes(kw)) && ((!st && !sz) || total>0);
        });
        const grid = document.getElementById('product-grid'); grid.innerHTML = "";
        if(filtered.length===0) { grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-color);"><p>🌸 ไม่พบสินค้า</p></div>`; return; }
        filtered.forEach(p => {
            let t = 0; STYLES.forEach(s => SIZES.forEach(sz => t += (parseInt(p[`${s} ${sz}`])||0)));
            const name = p['ชื่อลาย']||'SKU '+p['SKU']; let b = t>0 ? `<div class="stock-badge badge-instock">มีสินค้า</div>` : `<div class="stock-badge badge-outstock">สินค้าหมด</div>`;
            
            let coverImg = getDisplayCoverImage(p);
            let img = coverImg ? `<img src="${coverImg}" loading="lazy">` : `📸`;
            grid.innerHTML += `<div class="product-card" onclick="openStockModal('${p['SKU']}')"><div class="product-img-container">${b}${img}</div><div class="product-info"><div class="product-name">${name}</div><div class="product-details">สี${p['สี']||'-'}</div></div></div>`;
        });
    };

    window.openStockModal = function(sku) {
        const p = productsData.find(x => x && String(x['SKU'])===String(sku)) || {}; const name = p['ชื่อลาย']||'สินค้า';
        document.getElementById('modal-title').innerText = name; document.getElementById('modal-subtitle').innerText = `ผ้า: ${currentFabric} | สี: ${p['สี']||'-'} (รหัส: ${sku})`;

        let picData = p['รูปภาพสินค้า'];
        let imgList = [];
        if (Array.isArray(picData)) { imgList = picData; } 
        else if (picData) { imgList = [picData]; }

        let initialCover = getDisplayCoverImage(p);
        const imgBox = document.getElementById('modal-img-box');
        const thumbBox = document.getElementById('modal-thumbnail-box');

        if (imgList.length > 0) {
            currentActiveImgSrc = initialCover || imgList[0];
            imgBox.innerHTML = `<img id="main-modal-img" src="${currentActiveImgSrc}"><div class="zoom-badge">🔍 กดเพื่อดูรูปใหญ่</div>`;
            
            if (imgList.length > 1) {
                let tHtml = '';
                imgList.forEach((src) => {
                    let aClass = src === currentActiveImgSrc ? 'active' : '';
                    tHtml += `<img src="${src}" class="thumbnail-img ${aClass}" onclick="changeMainImage('${src}', this); event.stopPropagation();">`;
                });
                thumbBox.innerHTML = tHtml; thumbBox.style.display = 'flex';
            } else {
                thumbBox.style.display = 'none'; thumbBox.innerHTML = '';
            }
        } else {
            currentActiveImgSrc = ""; imgBox.innerHTML = `<span style="color:var(--accent-color);padding:40px;display:inline-block;">ไม่มีรูปภาพ</span>`;
            thumbBox.style.display = 'none'; thumbBox.innerHTML = '';
        }

        const tbody = document.getElementById('modal-stock-data'); tbody.innerHTML = "";
        STYLES.forEach(s => { let r = `<tr><td><b>${s}</b></td>`; SIZES.forEach(z => { let qty = parseInt(p[`${s} ${z}`])||0; r += `<td class="${qty>0?'qty-has':'qty-none'}">${qty>0?qty:'-'}</td>`; }); tbody.innerHTML += r+`</tr>`; });
        document.getElementById('line-order-link').href = `${LINE_OA_URL}?text=${encodeURIComponent('สนใจสอบถามสินค้า: '+name+' (สี '+p['สี']+' / รหัส '+sku+')')}`;
        document.getElementById('stockModal').style.display = 'flex';
    };

    window.changeMainImage = function(src, el) {
        currentActiveImgSrc = src;
        document.getElementById('main-modal-img').src = src;
        document.querySelectorAll('.thumbnail-img').forEach(img => img.classList.remove('active'));
        el.classList.add('active');
    };

    window.openLightbox = function() { 
        if(!currentActiveImgSrc) return;
        document.getElementById('lightbox-img').src = currentActiveImgSrc;
        document.getElementById('lightbox-download-btn').href = currentActiveImgSrc;
        document.getElementById('imageLightbox').style.display = 'flex';
    };

    window.closeLightbox = function() { document.getElementById('imageLightbox').style.display = 'none'; };
    window.closeModal = function() { document.getElementById('stockModal').style.display = 'none'; };
    window.onload = () => fetchProductsFromFirebase();
</script>

</body>
</html>
